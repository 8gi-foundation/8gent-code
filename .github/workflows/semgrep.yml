name: Semgrep Static Analysis

# Container pull + full scan is expensive. Run on PRs (catches issues before
# merge) and weekly (catches drift). Push-to-main was redundant with PR.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'  # Monday 8am UTC
  workflow_dispatch:

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Static Analysis
    runs-on: [self-hosted, spark]
    # NON-blocking - informational only
    continue-on-error: true
    container:
      image: returntocorp/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep scan --config auto --sarif --output semgrep-results.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
