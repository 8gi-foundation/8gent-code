name: macOS read boundary

# #4890 slice 1: the workspace read boundary enforced by the kernel (Seatbelt),
# behind EIGHT_OS_READ_BOUNDARY=1. sandbox-exec cannot nest, so the live suite
# cannot run inside a sandboxed dev session; it runs here, on a GitHub-hosted
# macOS runner, through the real run_command path with a planted outside secret.
# macOS minutes bill at 10x, so it runs only on pull requests that touch the
# boundary, on a release tag, and on demand.

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - packages/permissions/run-command-sandbox.ts
      - packages/permissions/read-boundary.ts
      - packages/permissions/read-allow.ts
      - packages/permissions/seatbelt.ts
      - packages/permissions/os-read-boundary.test.ts
      - packages/eight/tools.ts
      - packages/ai/tools.ts
      - packages/tools/background.ts
      - .github/workflows/macos-read-boundary.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-read-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: kernel read boundary, live (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      # Makes a skipped live suite a failure, not a silent pass.
      EIGHT_OS_READ_E2E: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      # macos-latest ships Node 24, whose headers better-sqlite3 cannot compile
      # against; Node 20 (as smoke-compiled.yml) has prebuilt-compatible headers.
      - name: Setup Node (native dependency builds)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install

      # rg is part of the false-positive set; the test fails if it is missing here.
      - name: ripgrep
        run: command -v rg || brew install ripgrep

      - name: sandbox-exec can apply a profile on this runner
        run: /usr/bin/sandbox-exec -p '(version 1)(allow default)' /usr/bin/true

      # The grep makes a skip fail: every test in the file must run here.
      - name: Live read boundary through run_command
        run: |
          set -o pipefail
          bun test packages/permissions/os-read-boundary.test.ts 2>&1 | tee os-read.log
          grep -q " 0 fail" os-read.log
          if grep -qE "^ *[0-9]+ skip" os-read.log; then
            echo "::error::a test skipped on the macOS runner"
            exit 1
          fi
