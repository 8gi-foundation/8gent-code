name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      # #4143: bun runs native install scripts via `bunx node-gyp@latest` when no
      # node-gyp is on PATH, and parallel installs race on that download (the
      # same race .github/docker/linux-ci/Dockerfile pins node-gyp to avoid).
      # ubuntu-latest already ships python3, make and g++, so no apt step.
      - name: "Pin node-gyp for native builds"
        run: npm install -g --no-fund --no-audit node-gyp@12.4.0 && node-gyp --version

      - name: Install dependencies
        run: bun install

      # node-pty is optional and its build fails quietly, so a missing module
      # used to surface as five pty-session failures ("Received: 66").
      - name: "Preflight native deps (node-pty)"
        run: bun run preflight:native

      - name: Check for merge conflict markers
        run: |
          if grep -rn --include='*.ts' --include='*.tsx' -lE '^<<<<<<< |^>>>>>>> ' \
            packages/ apps/ bin/ scripts/ \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
            2>/dev/null | grep .; then
            echo "::error::Merge conflict markers found in TypeScript source files"
            echo "Run: grep -rnE '^<<<<<<< |^>>>>>>> ' --include='*.ts' --include='*.tsx' packages/ apps/ bin/"
            exit 1
          fi
          echo "Conflict marker check: PASS"

      - name: Type check
        run: bun run typecheck

      # #4135: apps/tui/tsconfig.json narrows include to the TUI's src, so it is
      # its own typecheck scope. It was run by no workflow and sat red on main.
      - name: "Type check (TUI scope)"
        run: bun run typecheck:tui

      # #4135: tsconfig.harness.json covers bin/8gent.ts, the binary users run.
      # It was run by no workflow and hid six errors, two of them live bugs.
      - name: "Type check: harness (bin/8gent.ts, tsconfig.harness.json)"
        run: bun run check:harness

      - name: Lint
        run: bun run lint

      # #4135: biome check (lint, format, import order) and format:check were run
      # by no workflow. main still carries 664 unformatted files and 272 unsorted
      # import blocks, so these gate the files a change touches: new debt fails,
      # old debt shrinks with every edit, and no repo-wide reformat has to land
      # on top of the open PRs. The base is HEAD^1 on a pull request (the main
      # tip the checked-out merge commit sits on, so a PR is never failed on
      # files it did not touch after main moved), or the previous main tip on a
      # push. A pure move of a legacy unformatted file (R100) fails at its new
      # path by design: a mechanical move PR reformats what it moves. -z keeps
      # non-ASCII and unusual paths intact (git would otherwise quote them and
      # biome would skip them). The root package.json is excluded until the
      # full-repo reformat (the follow-up to #4135) lands: release bumps and open
      # PRs edit it, so a whole-file reformat would conflict with all of them.
      - name: "Biome check (changed files)"
        env:
          BIOME_SINCE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        # The default run shell is `bash -e {0}` without pipefail: a failing git diff
        # (unreachable base sha) would feed xargs nothing and pass green. #4148.
        run: |
          set -o pipefail
          git diff -z --name-only --diff-filter=ACMR "$BIOME_SINCE"...HEAD -- . ':!package.json' | xargs -0 -r bunx biome check --no-errors-on-unmatched

      - name: "Format check (changed files)"
        env:
          BIOME_SINCE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        # The default run shell is `bash -e {0}` without pipefail: a failing git diff
        # (unreachable base sha) would feed xargs nothing and pass green. #4148.
        run: |
          set -o pipefail
          git diff -z --name-only --diff-filter=ACMR "$BIOME_SINCE"...HEAD -- . ':!package.json' | xargs -0 -r bunx biome format --no-errors-on-unmatched

      # The locate tool shells out to ripgrep; ubuntu-latest does not ship it (#3287).
      # Without rg, locate degrades to a stated note, which its own tests cover.
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep && rg --version

      - name: Test
        run: bun run test

      # #4132 (8SO): the HMAC key probes must run under a real run_command boundary on Linux.
      # bwrap is installed only for this step, after the main suite, so other tests keep
      # their unwrapped behaviour. EIGHT_REQUIRE_RUN_COMMAND_SANDBOX=1 makes the probe file
      # fail, not skip, when bwrap cannot create a namespace here.
      - name: "run_command sandbox live probes (bwrap)"
        env:
          EIGHT_REQUIRE_RUN_COMMAND_SANDBOX: "1"
        run: |
          sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
          bun test packages/permissions/goal-state-hmac-keypath.probe.test.ts

      # compare_layout renders pages in a real Chrome (#4080). ubuntu-latest ships
      # google-chrome; this step fails, not skips, if it is missing or cannot start,
      # so the offline guarantees are proven on every run.
      - name: compare_layout offline guarantees (real Chrome)
        env:
          EIGHT_REQUIRE_CHROME: "1"
          EIGHT_CHROME_NO_SANDBOX: "1"
        run: |
          google-chrome --version
          bun test packages/tools/__tests__/layout-compare.test.ts

      - name: Computer-use smoke (Phase 3)
        run: bun run packages/eight/scripts/computer-use-suite.ts

      - name: Build CLI
        run: bun run build

      - name: Verify build output
        run: |
          test -f dist/cli.js || (echo "Build failed: dist/cli.js not found" && exit 1)
          head -1 dist/cli.js | grep -qxF "#!/usr/bin/env -S bun --no-install --no-env-file --config=/dev/null" || (echo "Safe shebang missing (#4013)" && exit 1)
          echo "Build OK: $(wc -c < dist/cli.js | tr -d ' ') bytes"

      # #3219: the npm tarball must install and run on a machine that is not
      # the builder's. Packs, installs with an isolated HOME, runs --version,
      # and opens the TUI under a pty until its first screen renders.
      - name: Packaging unit tests
        run: bun test scripts/lib/

      - name: npm pack-and-install smoke
        run: bun scripts/pack-smoke.ts --skip-build
        env:
          # Comma-separated owner names/emails the bundle must never contain.
          # Held in a repository secret, never in the repo.
          PACK_SMOKE_OWNER_IDENTITY: ${{ secrets.PACK_SMOKE_OWNER_IDENTITY }}

      # #3326: release dry run. The same command release.yml runs on a tag, so
      # a PR that would make the release ship without its tarball or checksums
      # fails here, not on release day. Nothing is uploaded or published.
      - name: Release guard selftest
        run: bash scripts/release-guard.sh selftest

      - name: Release dry run (npm tarball + SHA256SUMS)
        run: |
          rm -rf "$RUNNER_TEMP/release-assets"
          COUNT="$(bash scripts/release-guard.sh pack "$RUNNER_TEMP/release-assets")"
          VERSION="$(node -p "require('./package.json').version")"
          cd "$RUNNER_TEMP/release-assets"
          ls -la
          test -s "8gi-foundation-8gent-code-${VERSION}.tgz" || { echo "::error::no npm tarball for ${VERSION}"; exit 1; }
          sha256sum -c SHA256SUMS
          [ "$COUNT" -ge 2 ] || { echo "::error::expected at least 2 release assets, staged ${COUNT}"; exit 1; }
          echo "release dry run: ${COUNT} assets staged for v${VERSION}"

      - name: "No workspace: specifier in manifests, bun.lock or the npm tarball"
        run: bun scripts/lib/no-workspace-protocol.ts "$RUNNER_TEMP"/release-assets/*.tgz

      - name: Lockfile is in sync with the manifests
        run: bun install --frozen-lockfile

      - name: Verify version sync
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          BIN_VERSION=$(grep 'const VERSION' bin/8gent.ts | grep -o '"[^"]*"' | tr -d '"')
          if [ "$PKG_VERSION" != "$BIN_VERSION" ]; then
            echo "Version mismatch: package.json=$PKG_VERSION bin/8gent.ts=$BIN_VERSION"
            exit 1
          fi
          echo "Version sync OK: $PKG_VERSION"

      - name: Security - secrets scan
        run: |
          # Test files legitimately contain fake fixtures; gitleaks (the
          # Secret Detection job) scans them properly with allowlisting.
          #
          # grep exits 1 when it matches nothing, which is the normal case here and
          # is accepted below. Any other non-zero exit means the scan did not run -
          # a malformed pattern, a missing path - and must fail the step rather than
          # report a clean tree. Before this, `|| true` collapsed the two and a
          # broken pattern passed green on the only blocking secret control.
          # A missing directory is checked here rather than left to grep's exit code:
          # recursive grep does not report one the same way on every platform.
          SCAN_DIRS="packages apps bin"
          for d in $SCAN_DIRS; do
            if [ ! -d "$d" ]; then
              echo "::error::secrets scan path $d/ is missing - the scan would cover less than it claims"
              exit 1
            fi
          done
          set +e
          RAW=$(grep -rn --include='*.ts' --include='*.json' \
            -E '(API_KEY|SECRET|PASSWORD|PRIVATE_KEY|TOKEN|CREDENTIAL)\s*[:=]\s*"[^"]{8,}' \
            $SCAN_DIRS \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.8gent --exclude-dir=__tests__ \
            --exclude='*.test.ts' \
            2>/dev/null)
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "::error::secrets scan could not run (grep exit $rc) - the pattern or a path is wrong"
            exit 1
          fi
          FINDINGS=$(printf '%s\n' "$RAW" | grep -v 'description\|placeholder\|example\|interface\|type ' || true)
          if [ -n "$FINDINGS" ]; then
            echo "Potential hardcoded secrets found:"
            echo "$FINDINGS"
            exit 1
          fi
          echo "Secrets scan PASS"

      - name: Policy engine integrity
        run: |
          bun -e "
            import {parse} from 'yaml';
            import {readFileSync} from 'fs';
            const p = parse(readFileSync('packages/permissions/default-policies.yaml','utf-8'));
            const list = p.policies;
            const fail = (m) => { console.error('Policy integrity: ' + m); process.exit(1); };
            if (!Array.isArray(list) || list.length === 0) fail('no policies parsed');
            // The default policies this repo ships. Any change to the set in
            // default-policies.yaml (add, remove, rename) must update this list in the
            // same PR, so swapping a block rule for an allow rule is never silent.
            const EXPECTED = [
              'no-secrets-in-files',
              'no-env-file-leak',
              'no-rm-rf-root',
              'no-fork-bomb',
              'no-pipe-to-shell',
              'no-sudo-destructive',
              'protected-branches-push',
              'no-force-push-main',
              'no-hard-reset',
              'no-exfil-domains',
              'desktop-require-approval',
              'desktop-block-dangerous-keys',
              'desktop-allow-screenshot',
              'desktop-quit-require-approval',
              'extension-call-unattended-require-approval',
              'no-delete-config',
              'mcp-config-and-policies-write-approval',
              'mcp-config-and-policies-delete-approval',
              'mcp-config-and-policies-shell-approval',
              'agent-mail-cross-user-block',
              'agent-mail-cross-channel-approval',
              'agent-mail-read-other-user-block',
              'peers-cross-user-block',
              'email-send-rate-limit',
              'email-send-bulk-approval',
              'email-send-new-recipient-quarantine',
              'email-receive-high-spam-block',
              'issue-email-reserved-name-block',
            ];
            const REQUIRED = ['name', 'action', 'condition', 'decision', 'message'];
            const DECISIONS = ['block', 'require_approval', 'allow'];
            const seen = new Set();
            list.forEach((pol, i) => {
              for (const k of REQUIRED)
                if (typeof pol[k] !== 'string' || pol[k].trim() === '')
                  fail('policy ' + i + ' (' + (pol.name || 'unnamed') + ') is missing ' + k);
              if (!DECISIONS.includes(pol.decision))
                fail('policy ' + pol.name + ': decision ' + JSON.stringify(pol.decision) +
                     ' is not one of ' + DECISIONS.join(', '));
              if (seen.has(pol.name)) fail('duplicate policy name: ' + pol.name);
              seen.add(pol.name);
            });
            const expected = new Set(EXPECTED);
            const removed = EXPECTED.filter((n) => !seen.has(n));
            const added = [...seen].filter((n) => !expected.has(n));
            if (removed.length) console.error('Policy integrity: policies removed: ' + removed.join(', '));
            if (added.length) console.error('Policy integrity: policies added: ' + added.join(', ') +
              ' - add each to EXPECTED in the Policy engine integrity step of ci.yml in the same PR');
            if (removed.length || added.length) process.exit(1);
            console.log(list.length + ' policies, all expected, unique and well-formed - OK');
          "

      # audit-ci was replaced: it cannot read bun.lock and errored on every run
      # ("Cannot establish package-manager type, missing package-lock.json, yarn.lock,
      # and pnpm-lock.yaml"), so this step never audited anything and printed a warning
      # that looked like a finding. bun audit reads bun.lock.
      #
      # Non-blocking until the count reaches zero, with the number stated rather than
      # hidden: the tree carries 179 advisories (11 critical, 71 high, 77 moderate, 20 low)
      # as of 2026-10-13; this step prints the 82 at high or above.
      # A step that fails on every run is bypassed within a day, so this reports and the
      # advisories are tracked as work. Delete this comment and the flag together.
      - name: Dependency audit
        continue-on-error: true
        run: bun audit --audit-level=high

      - name: 200-line rule check
        run: |
          bun -e "
            import { readdirSync, readFileSync, statSync } from 'fs';
            import { join, relative } from 'path';

            const EXEMPT_PATTERNS = [
              /\.d\.ts$/, /\.test\.ts$/, /\.spec\.ts$/, /\.config\./,
              /node_modules/, /dist\//, /\.next\//, /\.8gent\//,
              /benchmarks\//, /\.github\//,
            ];

            const MAX_LINES = 200;
            const violations: string[] = [];

            function scan(dir: string) {
              for (const entry of readdirSync(dir, { withFileTypes: true })) {
                const full = join(dir, entry.name);
                if (entry.isDirectory()) {
                  if (entry.name === 'node_modules' || entry.name === 'dist' || entry.name === '.git') continue;
                  scan(full);
                } else if (entry.name.endsWith('.ts') || entry.name.endsWith('.tsx')) {
                  const rel = relative(process.cwd(), full);
                  if (EXEMPT_PATTERNS.some(p => p.test(rel))) continue;

                  const content = readFileSync(full, 'utf-8');
                  if (content.includes('8gi:200-exempt')) continue;

                  const lines = content.split('\n')
                    .filter(l => l.trim() !== '' && !l.trim().startsWith('//') && !l.trim().startsWith('/*') && !l.trim().startsWith('*'))
                    .length;

                  if (lines > MAX_LINES) {
                    violations.push(rel + ': ' + lines + ' lines');
                  }
                }
              }
            }

            scan('packages');
            scan('apps');
            scan('bin');

            if (violations.length > 0) {
              console.log('200-line rule violations (' + violations.length + ' files):');
              violations.forEach(v => console.log('  ' + v));
              console.log('');
              console.log('Add \"// 8gi:200-exempt\" to files with documented exceptions.');
              console.log('::warning::' + violations.length + ' files exceed 200-line limit');
            } else {
              console.log('200-line rule: PASS');
            }
          "

      # #3575: PRs do not edit CHANGELOG.md. The release step builds it from
      # merged PR titles (scripts/changelog-release.ts), so parallel PRs stop
      # conflicting on the same lines. Only release PRs should touch it.
      - name: CHANGELOG.md is built at release
        if: github.event_name == 'pull_request'
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD 2>/dev/null || git diff --name-only HEAD~1)
          if echo "$CHANGED" | grep -qxF "CHANGELOG.md"; then
            echo "::warning::This PR edits CHANGELOG.md. Unless it is a release PR, drop that change: the release step builds the changelog from merged PR titles (#3575)."
          else
            echo "No CHANGELOG.md edit - OK"
          fi

  smoke:
    name: Harness Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install
      - name: CLI version check
        run: |
          OUTPUT=$(bun run cli -- --version 2>&1 || true)
          echo "CLI output: $OUTPUT"
          echo "$OUTPUT" | grep -qE '[0-9]+\.[0-9]+\.[0-9]+' || (echo "::error::CLI did not output a version" && exit 1)
          echo "CLI smoke: PASS"
        env:
          INFERENCE_MODE: offline
