name: 8gent Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: 8gent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      # An explicit permissions block sets every UNLISTED scope to `none`, so
      # listing only pull-requests left contents: none and actions/checkout@v4
      # failed with "remote: Repository not found" on every PR since this
      # workflow was added. The review step never ran once.
      contents: read
      pull-requests: write
    env:
      # Job level, not step level: the post-review step's guard needs to see
      # these too, otherwise it concludes "no secret on this repo" while the
      # review step had one.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - run: bun install --frozen-lockfile

      - name: Get PR diff
        run: git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff

      - name: Configure the reviewer provider
        run: |
          # 8gent's provider registry ships with `openrouter` disabled and reads
          # ~/.8gent/providers.json. On a fresh runner there is no config, so the
          # review command falls into its interactive setup menu and produces no
          # output at all. Provision it here instead.
          mkdir -p ~/.8gent
          cat > ~/.8gent/providers.json <<'JSON'
          {
            "activeProvider": "groq",
            "activeModel": "openai/gpt-oss-120b",
            "providers": {
              "groq": { "enabled": true },
              "openrouter": { "enabled": true }
            }
          }
          JSON

      - name: Run 8gent review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # stdout only. Folding stderr in (2>&1) corrupted the JSON with any
          # warning the harness printed, which then broke the parse below.
          bun run bin/8gent.ts review --diff=/tmp/pr.diff --json > /tmp/review.json 2>/tmp/review.err || true
          echo "--- review stderr ---"
          cat /tmp/review.err || true

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A review that produced no output is not a review. Exit non-zero so the
          # check is RED: a green build that silently reviewed nothing is worse
          # than no check at all.
          if [ ! -s /tmp/review.json ] || ! grep -q '"summary"\|"findings"\|"verdict"' /tmp/review.json; then
            echo "REVIEW_MISSING: 8gent review produced no usable output." >&2
            echo "--- stderr ---" >&2
            cat /tmp/review.err >&2 || true
            exit 1
          fi
          # The reviewer needs a model. There is no OPENROUTER_API_KEY secret on
          # this repo and no local model on the runner, so a non-JSON body is the
          # NORMAL case, not an anomaly. Report that plainly instead of dying on
          # JSON.parse and painting the PR red for a reason unrelated to the code.
          BODY=$(bun -e "
            const raw = (await Bun.stdin.text()).trim();
            let out;
            try {
              const j = JSON.parse(raw);
              out = j.review || j.error || 'No output';
            } catch {
              out = raw
                ? '_The reviewer did not return JSON. Raw output:_\n\n\`\`\`\n' + raw.slice(0, 4000) + '\n\`\`\`'
                : '_The reviewer produced no output (no model configured for CI)._';
            }
            console.log('## 8gent Review\n\n' + out);
          " < /tmp/review.json)
          gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            -f body="$BODY"
