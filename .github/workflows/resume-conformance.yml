# resume-conformance.yml - Hard-kill and resume conformance on all three hosted
# OSes (#4113). Two files, each killing a real child process from a second
# process (kill -KILL on POSIX, Stop-Process -Force on Windows):
#   - goal-resume-conformance.test.ts: GoalManager.resume() after the kill either
#     reports the run ready at the offset both stores agree on, or refuses with
#     "ledger verify failed" (tampered, truncated, torn, missing, wrong key, no key).
#   - session-journal.test.ts: the journal survives the kill and the session comes back.
# Linux and macOS also run scripts/ci/durable-kill-resume.ts from source (each
# interrupted call handled by its replay class); Windows runs it against the
# compiled exe in windows-smoke.yml. ci.yml and platforms.yml do not cover
# macOS; this is the one place all three run. No model is contacted.

name: Resume conformance

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/resume-conformance.yml
      - packages/daemon/**
      - packages/goal/**
      - packages/db/**
      - packages/eight/**
      - packages/ai/**
      - tests/force-kill.ts
      - tests/rm-retry.ts
      - scripts/ci/durable-kill-resume.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resume-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      # macos-latest ships Node 24, whose headers better-sqlite3 cannot compile
      # against; Node 20 (as smoke-compiled.yml) has prebuilt-compatible headers.
      - name: Setup Node (native dependency builds)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Install dependencies
        run: bun install
      # A skipped case would pass silently, so any skip fails the step.
      - name: Kill mid-step, then resume or refuse
        run: |
          bun test packages/daemon/goal-resume-conformance.test.ts packages/daemon/session-journal.test.ts 2>&1 | tee conformance.log
          rc=${PIPESTATUS[0]}
          if grep -Eq '^ *[1-9][0-9]* skip' conformance.log; then echo "::error::a conformance case was skipped on $RUNNER_OS"; exit 1; fi
          exit $rc
      # Windows runs this proof against the compiled exe in windows-smoke.yml.
      - name: Daemon kill-and-resume proof from source (replay classes)
        if: runner.os != 'Windows'
        run: bun scripts/ci/durable-kill-resume.ts bun "$PWD/bin/8gent.ts" daemon run
