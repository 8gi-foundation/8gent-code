# clean-install.yml - install a PUBLISHED release the way a stranger does (#3743).
#
# Runs scripts/clean-install-check.sh on the self-hosted helm runner: a plain
# node:22 container, no repo checkout inside it, no Bun, a fresh HOME. It
# installs @8gi-foundation/8gent-code@<version> from npm (or the release
# tarball, checked against SHA256SUMS, when the npm publish lags), then runs
# `8gent --version` and `8gent --help`. A release with neither an npm version
# nor a tarball fails here instead of going out empty (#3326).
#
# TRIGGERS:
#   release: published   a release a person publishes.
#   workflow_run Release the Release workflow tags and releases with
#                        GITHUB_TOKEN, and events made by that token do not
#                        start other workflows (#3658), so `release: published`
#                        alone would never fire for our own releases.
#                        workflow_run does. Runs only when Release ran on a v* tag.
#   workflow_dispatch    any version, `latest`, or a tarball URL.
#   pull_request         only when the check itself changes; checks npm latest.
#
# Reproduce locally with Docker:
#   sh scripts/clean-install-check.sh 0.17.0

name: Clean install

on:
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (0.19.0 or v0.19.0), latest, or a release tarball URL"
        required: true
        default: latest
  pull_request:
    branches: [main]
    paths:
      - scripts/clean-install-check.sh
      - .github/workflows/clean-install.yml

permissions:
  contents: read

concurrency:
  group: clean-install-${{ github.event.release.tag_name || github.event.workflow_run.head_branch || inputs.version || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  clean-install:
    name: Clean-container install of the published package
    # Self-hosted: never run code from a fork's pull request on this machine.
    # workflow_run: only a Release run on a v* tag, and not one that was cancelled.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'workflow_run' || (startsWith(github.event.workflow_run.head_branch, 'v') && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.conclusion != 'skipped'))
    runs-on: [self-hosted, 8gi, helm]
    timeout-minutes: 20
    steps:
      # Only the script, from main (or the PR under test). Old tags predate it,
      # and nothing else from the repo is needed: the container never sees it.
      - name: Fetch the check script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.event.repository.default_branch }}
          sparse-checkout: scripts/clean-install-check.sh
          sparse-checkout-cone-mode: false

      - name: Which release
        id: target
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          INPUT: ${{ inputs.version }}
        run: |
          case "$EVENT" in
            release)      T=$RELEASE_TAG ;;
            workflow_run) T=$RUN_TAG ;;
            workflow_dispatch) T=$INPUT ;;
            *)            T=latest ;;
          esac
          [ -n "$T" ] || { echo "::error::No version to check for event $EVENT"; exit 1; }
          echo "target=$T" >> "$GITHUB_OUTPUT"
          echo "Checking: $T ($EVENT)"

      - name: Docker is up
        run: |
          docker info --format 'docker {{.ServerVersion}} {{.OSType}}/{{.Architecture}}' \
            || { echo "::error::Docker daemon is not reachable from the runner. Is Docker Desktop running?"; exit 1; }

      - name: Clean-container install
        shell: bash
        timeout-minutes: 15
        env:
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          OUT="$RUNNER_TEMP/clean-install-${{ github.run_id }}.log"
          set +e
          sh scripts/clean-install-check.sh "$TARGET" 2>&1 | tee "$OUT"
          CODE=${PIPESTATUS[0]}
          set -e
          {
            echo "### Clean-container install: \`$TARGET\`"
            echo
            echo '```'
            grep -E '^(==|node |npm latest|PASS|FAIL|NOTE|clean-install-check:)' "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$OUT"
          if [ "$CODE" != 0 ]; then
            echo "::error::A stranger cannot install $TARGET. See the job summary."
          fi
          exit "$CODE"
