name: Auto Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

# Security (#3214): this job holds a contents:write token. Nothing from the
# event payload (PR title, labels, author) or from step outputs is ever
# expanded with ${{ }} inside a run: script, where it would be pasted into the
# shell source before bash parses it. Every such value reaches the script
# through env: and is read as a quoted shell variable. Actions are pinned to
# commit SHAs.

jobs:
  release:
    name: Create Release
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get latest tag version
        id: latest_tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION="${LATEST_TAG#v}"
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG (version: $VERSION)"

      - name: Determine version bump
        id: bump_type
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # Check PR labels first (highest priority)
          if [[ "$PR_LABELS" == *"major"* ]] || [[ "$PR_LABELS" == *"breaking"* ]]; then
            echo "bump=major" >> $GITHUB_OUTPUT
            echo "Bump type: MAJOR (from label)"
          elif [[ "$PR_LABELS" == *"minor"* ]] || [[ "$PR_LABELS" == *"feature"* ]]; then
            echo "bump=minor" >> $GITHUB_OUTPUT
            echo "Bump type: MINOR (from label)"
          elif [[ "$PR_LABELS" == *"patch"* ]] || [[ "$PR_LABELS" == *"fix"* ]]; then
            echo "bump=patch" >> $GITHUB_OUTPUT
            echo "Bump type: PATCH (from label)"
          # Fall back to conventional commit prefix in PR title
          elif [[ "$PR_TITLE" =~ ^feat!:|^BREAKING ]]; then
            echo "bump=major" >> $GITHUB_OUTPUT
            echo "Bump type: MAJOR (breaking change in title)"
          elif [[ "$PR_TITLE" =~ ^feat:|^feat\( ]]; then
            echo "bump=minor" >> $GITHUB_OUTPUT
            echo "Bump type: MINOR (feature in title)"
          else
            # Default to patch for fix:, chore:, docs:, refactor:, etc.
            echo "bump=patch" >> $GITHUB_OUTPUT
            echo "Bump type: PATCH (default)"
          fi

      - name: Calculate new version
        id: new_version
        env:
          CURRENT: ${{ steps.latest_tag.outputs.version }}
          BUMP: ${{ steps.bump_type.outputs.bump }}
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP" in
            major)
              NEW_VERSION="$((MAJOR + 1)).0.0"
              ;;
            minor)
              NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
              ;;
            patch)
              NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
              ;;
          esac

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: v$NEW_VERSION (was v$CURRENT, bump: $BUMP)"

      - name: Update version in package.json and bin/8gent.ts
        env:
          NEW_VERSION: ${{ steps.new_version.outputs.version }}
        run: |
          # Update package.json version (no git tag, we handle that ourselves)
          npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version

          # Update VERSION constant in bin/8gent.ts
          sed -i "s/const VERSION = \".*\";/const VERSION = \"$NEW_VERSION\";/" bin/8gent.ts

          # Verify both files were updated
          echo "package.json version:"
          node -e "console.log(require('./package.json').version)"

          echo "bin/8gent.ts VERSION:"
          grep 'const VERSION' bin/8gent.ts

          # Commit version bump
          if ! git diff --quiet package.json bin/8gent.ts; then
            git add package.json bin/8gent.ts
            git commit -m "chore(release): bump version to v${NEW_VERSION}"
            if git push origin main; then
              echo "Version bump committed and pushed"
            else
              echo "::warning::Could not push version update to main (branch protection). Update versions manually or via next PR."
            fi
          else
            echo "No version changes needed"
          fi

      - name: Create and push tag
        env:
          NEW_VERSION: ${{ steps.new_version.outputs.version }}
        run: |
          git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"

      - name: Generate release notes
        id: release_notes
        env:
          NEW_VERSION: ${{ steps.new_version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.latest_tag.outputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: |
          # Categorize commits since last release
          FEATURES=""
          FIXES=""
          DOCS=""
          REFACTORS=""
          CHORES=""
          OTHER=""

          if [ "$PREVIOUS_TAG" != "v0.0.0" ]; then
            while IFS= read -r line; do
              COMMIT_MSG="$line"
              if [[ "$COMMIT_MSG" =~ ^feat ]]; then
                FEATURES="${FEATURES}- ${COMMIT_MSG}"$'\n'
              elif [[ "$COMMIT_MSG" =~ ^fix ]]; then
                FIXES="${FIXES}- ${COMMIT_MSG}"$'\n'
              elif [[ "$COMMIT_MSG" =~ ^docs ]]; then
                DOCS="${DOCS}- ${COMMIT_MSG}"$'\n'
              elif [[ "$COMMIT_MSG" =~ ^refactor ]]; then
                REFACTORS="${REFACTORS}- ${COMMIT_MSG}"$'\n'
              elif [[ "$COMMIT_MSG" =~ ^chore ]] && [[ ! "$COMMIT_MSG" =~ ^chore\(release\) ]]; then
                CHORES="${CHORES}- ${COMMIT_MSG}"$'\n'
              elif [[ ! "$COMMIT_MSG" =~ ^Merge ]] && [[ ! "$COMMIT_MSG" =~ ^chore\(release\) ]]; then
                OTHER="${OTHER}- ${COMMIT_MSG}"$'\n'
              fi
            done < <(git log "${PREVIOUS_TAG}..HEAD" --pretty=format:"%s" --no-merges)
          fi

          # Build release notes
          cat > release_notes.md << 'RELEASE_EOF'
          ## What's Changed
          RELEASE_EOF
          echo "" >> release_notes.md
          echo "**PR #${PR_NUMBER}:** ${PR_TITLE}" >> release_notes.md

          if [ -n "$FEATURES" ]; then
            printf "\n### Features\n%s" "$FEATURES" >> release_notes.md
          fi

          if [ -n "$FIXES" ]; then
            printf "\n### Bug Fixes\n%s" "$FIXES" >> release_notes.md
          fi

          if [ -n "$REFACTORS" ]; then
            printf "\n### Refactoring\n%s" "$REFACTORS" >> release_notes.md
          fi

          if [ -n "$DOCS" ]; then
            printf "\n### Documentation\n%s" "$DOCS" >> release_notes.md
          fi

          if [ -n "$CHORES" ]; then
            printf "\n### Maintenance\n%s" "$CHORES" >> release_notes.md
          fi

          if [ -n "$OTHER" ]; then
            printf "\n### Other Changes\n%s" "$OTHER" >> release_notes.md
          fi

          # Footer
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "**Install:** \`npm install -g @8gi-foundation/8gent-code@${NEW_VERSION}\`" >> release_notes.md
          echo "**Merged by:** @${PR_AUTHOR}" >> release_notes.md

          if [ "$PREVIOUS_TAG" != "v0.0.0" ]; then
            echo "**Full Changelog:** https://github.com/${REPO}/compare/${PREVIOUS_TAG}...v${NEW_VERSION}" >> release_notes.md
          fi

          echo "--- Release Notes ---"
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.new_version.outputs.version }}
          name: v${{ steps.new_version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        env:
          PREVIOUS_TAG: ${{ steps.latest_tag.outputs.tag }}
          NEW_VERSION: ${{ steps.new_version.outputs.version }}
          BUMP: ${{ steps.bump_type.outputs.bump }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "## Release Created" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Previous Version | ${PREVIOUS_TAG} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| New Version | v${NEW_VERSION} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bump Type | ${BUMP} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| PR | #${PR_NUMBER} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| npm | \`npm install -g @8gi-foundation/8gent-code@${NEW_VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
