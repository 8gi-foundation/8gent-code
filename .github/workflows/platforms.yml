name: Platforms
on:
  workflow_dispatch:
jobs:
  platform:
    name: windows-diag
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: store bisection
        run: bun diag/diag-store.ts || true
      - name: store.test alone
        run: bun test packages/memory/store.test.ts 2>&1 | grep -E "fail|pass|EBUSY" || true
      - name: eight suites with probe
        run: bun test --preload ./diag/probe-rm.ts packages/eight/ 2>&1 | grep -E "LOCKED|^\(fail\)| fail$| pass$" || true
      - name: memory and eight together with probe
        run: bun test --preload ./diag/probe-rm.ts packages/memory/ packages/eight/ 2>&1 | grep -E "LOCKED|^\(fail\)| fail$| pass$" || true
