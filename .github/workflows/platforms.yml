name: Platforms
on:
  workflow_dispatch:
jobs:
  platform:
    name: windows-diag
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: memory and eight with retry probe
        run: bun test --preload ./diag/retry-probe.ts packages/memory/ packages/eight/ 2>&1 | grep -E "RETRY| fail$| pass$" || true
      - name: full suite with retry probe
        run: bun test --preload ./diag/retry-probe.ts packages/ apps/ 2>&1 | grep -E "RETRY| fail$| pass$" || true
