# Example only: the 8gi-ops reconciler owns the real compose file.
#
# Publishes ONLY on 192.168.218.1 (the box's wg0 address). Never publish on
# 0.0.0.0 or the public IP. With Docker's iptables management off on 8gi-ops,
# the host address in "ports" is the only thing scoping the listener.
#
# First start on a NEW store creates the ledger key, explicitly, once:
#   docker compose run --rm table-server --init-key
# (stop it with Ctrl-C once it prints "listening"). An imported store brings
# its own keys/state-hmac.key in /data, and --init-key is never used.
#
# The token comes from the SOPS secrets the box decrypts to /run/8gi/secrets.
# The file must be owned by uid 1000 (the image's bun user), mode 0600, and
# hold one random token of at least 32 characters; anything else and the
# server refuses to start.
#
# The server makes no outbound connections, so the box's no-egress rule for
# containers costs it nothing.

services:
  table-server:
    image: 8gent-table-server:${TABLE_SERVER_TAG:?set the image tag}
    restart: unless-stopped
    ports:
      - "192.168.218.1:18789:18789"
    volumes:
      - table-data:/data
      - /run/8gi/secrets/table-server-token:/run/table/token:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]

volumes:
  table-data:
